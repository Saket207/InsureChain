version: '3.8'
services:
  chainlink-adapter:
    build: .
    ports:
      - "8080:8080"
    environment:
      - FLASK_API_URL=${FLASK_API_URL:-http://host.docker.internal:5000/api}
      - CHAINLINK_NODE_OUTGOING_TOKEN=${CHAINLINK_NODE_OUTGOING_TOKEN}
      - ADAPTER_PORT=8080
    restart: unless-stopped
